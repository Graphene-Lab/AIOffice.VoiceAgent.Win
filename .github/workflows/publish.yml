name: Publish NuGet Package

# GENERAL release rule, no project-file changes on any repo: a plain push is a code sync
# and publishes nothing — this workflow does not even run for it. Publishing is an explicit,
# versioned act: push a tag v* (e.g. v1.26.09.03) and the package is packed and published.
# Runs on windows-latest because the project targets net10.0-windows10.0.19041.0.
# AIOffice.VoiceAgent.Win keeps a plain ProjectReference to ..\AIOffice.VoiceAgent, so the
# sibling repo (public) is checked out at that exact relative path — restore/build would fail
# without its sources. The 325 MB kokoro.onnx is never downloaded during pack (the sibling's
# DownloadKokoroModel target is gated on _IsPacking) — the model is not part of the NuGet
# package.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      # Same folder layout as release-win.yml: this repo at ./AIOffice.VoiceAgent.Win and the
      # sibling at ./AIOffice.VoiceAgent. A root-level checkout would resolve the Win csproj's
      # relative ProjectReference (..\AIOffice.VoiceAgent) OUTSIDE the workspace and the SDK's
      # default **/*.cs glob would then compile the sibling sources into the Win project
      # (missing Whisper types → CS0246). Both subfolders are required for restore/build.
      - uses: actions/checkout@v4
        with:
          path: AIOffice.VoiceAgent.Win
      - uses: actions/checkout@v4
        with:
          repository: Graphene-Lab/AIOffice.VoiceAgent
          path: AIOffice.VoiceAgent
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pack
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            dotnet pack AIOffice.VoiceAgent.Win/AIOffice.VoiceAgent.Win.csproj -c Release -o ./out -p:SkipNuGetPush=true -p:RestoreForce=true && break
            echo "retry $i (waiting for dependency packages on nuget.org)..."
            sleep 60
          done
          test -n "$(ls ./out/*.nupkg 2>/dev/null)"
      - name: Push to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY secret is not set on this repository — the package was NOT published. Add the secret (Settings -> Secrets and variables -> Actions, same key as the other Graphene-Lab repos) and re-run this job."
            exit 1
          fi
          dotnet nuget push ./out/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
